[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yc-launch-monitor"
version = "0.1.0"
description = "Persistent launch monitor for YC, a16z Speedrun, X, LinkedIn and Slack"
requires-python = ">=3.12"

[project.scripts]
yc-launch-monitor = "yc_launch_monitor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
